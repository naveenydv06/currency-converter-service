name: CICD PIPELINE

on:
  push:
    branches: ["main"]

jobs:

  # ============================================================
  # COMPILE / INSTALL DEPENDENCIES
  # ============================================================

  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install Dependencies
        working-directory: ./src
        run: npm ci


  # ============================================================
  # SECURITY & SYNTAX CHECK
  # ============================================================

  security-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check Syntax
        run: |
          node --check src/backend/server.js
          node --check src/frontend/app.js

      # --------------------------------------------------------
      # Trivy Installation
      # --------------------------------------------------------

      - name: Trivy Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # --------------------------------------------------------
      # Trivy Filesystem Scan
      # --------------------------------------------------------

      - name: Trivy FS Scan
        run: |
          trivy fs \
            --format table \
            -o fs-report.txt \
            .

      # --------------------------------------------------------
      # Gitleaks Installation
      # --------------------------------------------------------

      - name: Gitleaks Installation
        run: |
          sudo apt-get update
          sudo apt-get install -y gitleaks

      # --------------------------------------------------------
      # Gitleaks Code Scan
      # --------------------------------------------------------

      - name: Gitleaks Code Scan
        run: |
          gitleaks detect \
            --source . \
            --report-path gitleaks-report.json \
            --report-format json


  # ============================================================
  # BUILD & DEPLOY TO EKS
  # ============================================================

  build-and-deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - compile
      - security-syntax-check

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: "us-east-1"
      ECR_REPOSITORY: "currency-converter-repo"
      EKS_CLUSTER: "currency-converter-app"
      K8S_NAMESPACE: "currency-converter-app"

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-eks-deploy
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Docker Build & Push
      # --------------------------------------------------------

      - name: Build, Tag, and Push Image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Configure Kubernetes
      # --------------------------------------------------------

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      # --------------------------------------------------------
      # Deploy to EKS
      # --------------------------------------------------------

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/currency-converter \
            my-app=${{ steps.build.outputs.image }} \
            -n "$K8S_NAMESPACE"

          kubectl rollout status deployment/currency-converter \
            -n "$K8S_NAMESPACE" \
            --timeout=180s